# Mic noise gate, hosted as its own PipeWire client (mirrors the shape of
# Hexarchy's speaker tuning host, but for the built-in microphone).
#
# PipeWire's filter-graph has a native `noisegate` node, so no EQ plugin is
# needed. The client exposes a gated virtual source "noise_gate_source";
# a companion autostart links the physical digital mic into capture.noise_gate
# and makes noise_gate_source the default input, so quiet-room fan noise does
# not register on the panel meter or reach applications.
#
# Run with: pipewire -c mic-noise-gate.conf
#
# The gate is mono (one FL channel) because the internal mic's two channels
# carry the same signal. Thresholds are linear 0..1, well under a normal
# speaking voice; "Close Threshold" < "Open Threshold" gives the gate a little
# hysteresis so it does not flutter while a word decays.
#
# 2026-09-15: two bugs found while debugging voxtype getting no audio.
# (1) `inputs`/`outputs` referenced "gate:in.FL"/"gate:out.FL", but this
#     build's noisegate ports are named "In"/"Out" (capitalized, no channel
#     suffix) -- the filter-graph failed to start at all ("input port
#     gate:in.FL not found"), so noise_gate_source produced total silence.
#     Fixed below.
# (2) Even with the port names fixed, the `noisegate` builtin itself never
#     passes audio through on this PipeWire (1.6.8) -- capture.noise_gate's
#     monitor shows real signal from the mic, but the gate's own output and
#     its "Level" meter stay at zero regardless of how low the thresholds are
#     set (tested down to 0.0001). That looks like a bug/limitation in this
#     PipeWire build's noisegate implementation, not a tuning problem.
#     Using `label = copy` (plain passthrough) below as a working stopgap --
#     no more noise gating for now, but the mic flows through again. Swap
#     back to the noisegate node (see git history / voxtype fix session) once
#     that's sorted out, or look at an `expander` node instead.

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }

    { name = libpipewire-module-protocol-native }

    { name = libpipewire-module-client-node }

    { name = libpipewire-module-adapter }

    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Microphone"
            media.name = "Microphone"

            filter.graph = {
                nodes = [
                    { type = builtin  name = gate  label = copy }
                ]
                links = [
                ]
                inputs = [ "gate:In" ]
                outputs = [ "gate:Out" ]
            }

            audio.position = [ FL ]

            capture.props = {
                node.name       = capture.noise_gate
                media.class     = Audio/Sink
                audio.position  = [ FL ]
            }
            playback.props = {
                node.name       = noise_gate_source
                media.class     = Audio/Source
                audio.position  = [ FL ]
                node.passive    = true
            }
        }
    }
]